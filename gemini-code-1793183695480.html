<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ураа мемы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #ffffff;
            --hint-color: #b0b0b0;
            --button-color: #8b5cf6;
            --button-text-color: #ffffff;
            --secondary-bg: #2a2a2a;
            --border-color: #383838;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        h2 {
            margin: 5px 0;
            font-size: 20px;
            text-align: center;
            color: var(--text-color);
        }

        .tabs {
            display: flex;
            width: 100%;
            max-width: 500px;
            margin-bottom: 10px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 4px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 8px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            color: var(--hint-color);
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--button-color);
            color: var(--button-text-color);
        }

        .section {
            display: none;
            width: 100%;
            max-width: 500px;
            flex-direction: column;
            align-items: center;
        }

        .section.active {
            display: flex;
        }

        .templates-grid, .gallery-grid, .moderation-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            max-height: 60vh;
            overflow-y: auto;
            padding: 5px;
            box-sizing: border-box;
        }

        .template-card, .gallery-item, .mod-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            padding: 8px;
            box-sizing: border-box;
        }

        .template-card img, .gallery-item img, .mod-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 350px;
            aspect-ratio: 1 / 1;
            background: #000000;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            touch-action: none; /* Блокировка жест зарытия в TG */
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        button, label.btn-file {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            display: inline-block;
        }

        button:active, label.btn-file:active {
            opacity: 0.8;
        }

        input[type="text"], input[type="file"], input[type="number"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            color: var(--text-color);
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }

        input::placeholder {
            color: var(--hint-color);
        }

        .row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .admin-badge {
            font-size: 12px;
            color: #f59e0b;
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            width: 100%;
            background: var(--surface-color);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }
        
        .slider-container input {
            flex: 1;
            accent-color: var(--button-color);
        }
    </style>
</head>
<body>

    <h2 id="app-title">🎨 ураа мемы</h2>
    <div id="user-info" class="admin-badge"></div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('create')">Конструктор</div>
        <div class="tab" onclick="switchTab('templates')">Шаблоны</div>
        <div class="tab" onclick="switchTab('gallery')">Галерея</div>
        <div class="tab" id="tab-admin" style="display:none;" onclick="switchTab('admin')">🛡 Админ</div>
    </div>

    <!-- Вкладка: Конструктор -->
    <div id="section-create" class="section active">
        <div class="canvas-container">
            <canvas id="memeCanvas" width="500" height="500"></canvas>
        </div>

        <div class="
