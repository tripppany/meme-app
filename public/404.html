<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Meme Generator</title>
  <script>
    // GitHub Pages 404 handler: redirect back to base repository root
    try {
      var segments = window.location.pathname.split('/').filter(Boolean);
      var repoBase = segments.length > 0 ? '/' + segments[0] + '/' : '/';
      window.location.replace(repoBase + window.location.search + window.location.hash);
    } catch (e) {
      window.location.replace('/');
    }
  </script>
</head>

</body>
</html>
