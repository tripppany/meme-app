<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Meme Generator - Telegram Mini App</title>
  <meta name="description" content="Telegram Mini App for generating, editing, moderating, and sharing memes in chat communities.">
  <meta property="og:title" content="Meme Generator - Telegram Mini App">
  <meta property="og:description" content="Telegram Mini App for generating, editing, moderating, and sharing memes in chat communities.">
  <meta name="theme-color" content="#0f172a">

  <!-- Critical styles to avoid white flash before CSS bundle loads -->
  <style>
    html, body {
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      min-height: 100%;
    }
  </style>

  <!-- Telegram WebApp SDK (Asynchronous and non-blocking so it NEVER halts rendering over VPN) -->
  <script>
    (function() {
      function initTgInstance() {
        try {
          if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            if (window.Telegram.WebApp.setHeaderColor) window.Telegram.WebApp.setHeaderColor('#1e293b');
            if (window.Telegram.WebApp.setBackgroundColor) window.Telegram.WebApp.setBackgroundColor('#0f172a');
            return true;
          }
        } catch (e) {
          console.warn('[Telegram SDK] init error:', e);
        }
        return false;
      }

      // Check if Telegram client already injected WebApp directly into window
      if (!initTgInstance()) {
        // Asynchronously load external SDK with non-blocking script element
        var tgScript = document.createElement('script');
        tgScript.src = 'https://telegram.org/js/telegram-web-app.js';
        tgScript.async = true;
        tgScript.defer = true;
        tgScript.onload = function() {
          initTgInstance();
        };
        tgScript.onerror = function() {
          console.warn('[Telegram SDK] External script blocked or unreachable (VPN/firewall). Using standalone mode.');
        };
        document.head.appendChild(tgScript);
      }

      // Safeguard interval to catch delayed injection
      var retries = 0;
      var interval = setInterval(function() {
        retries++;
        if (initTgInstance() || retries >= 15) {
          clearInterval(interval);
        }
      }, 100);
    })();
  </script>

  <!-- Font Awesome Icons (loaded asynchronously, never blocks rendering) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </noscript>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
  <div id="root">
    <!-- Immediate non-white fallback placeholder while React mounts -->
    <div id="preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; color: #f8fafc; text-align: center; font-family: system-ui, -apple-system, sans-serif; padding: 24px;">
      <div style="width: 64px; height: 64px; background: linear-gradient(135deg, #f59e0b, #fcd34d); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.3); animation: pulse 1.5s infinite ease-in-out;">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
        </svg>
      </div>
      <div style="font-size: 20px; font-weight: 800; letter-spacing: 0.5px; color: #ffffff;">ураа мемы</div>
      <div id="loader-status" style="font-size: 13px; color: #94a3b8; margin-top: 8px;">Загрузка приложения...</div>
      
      <!-- Fallback button in case of slow network / VPN -->
      <div id="slow-network-fallback" style="display: none; margin-top: 16px;">
        <div style="font-size: 11px; color: #fbbf24; margin-bottom: 12px; max-width: 260px; line-height: 1.4;">
          Медленный ответ сети или VPN. Нажмите для быстрой перезагрузки:
        </div>
        <button onclick="window.location.reload(true)" style="background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; border: none; border-radius: 12px; padding: 10px 20px; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);">
          Перезагрузить приложение
        </button>
      </div>
    </div>
  </div>
  <script>
    setTimeout(function() {
      var statusEl = document.getElementById('loader-status');
      if (statusEl && document.getElementById('preloader')) {
        statusEl.textContent = 'Инициализация компонентов...';
      }
    }, 1200);
    setTimeout(function() {
      var fb = document.getElementById('slow-network-fallback');
      var statusEl = document.getElementById('loader-status');
      if (document.getElementById('preloader')) {
        if (statusEl) statusEl.textContent = 'Ожидание ответа сети (VPN)...';
        if (fb) fb.style.display = 'block';
      }
    }, 2500);
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
