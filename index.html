<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Meme Generator - Telegram Mini App</title>
  <meta name="description" content="Telegram Mini App for generating, editing, moderating, and sharing memes in chat communities.">
  <meta property="og:title" content="Meme Generator - Telegram Mini App">
  <meta property="og:description" content="Telegram Mini App for generating, editing, moderating, and sharing memes in chat communities.">
  <meta name="theme-color" content="#0f172a">

  <!-- Critical styles to avoid white flash before CSS bundle loads -->
  <style>
    html, body {
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      min-height: 100%;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.97); }
    }
  </style>

  <!-- Immediate Telegram WebApp Bridge: signals ready & expand to Telegram native client at 0ms -->
  <script>
    (function() {
      function postToTelegram(eventType, eventData) {
        try {
          var dataStr = typeof eventData === 'string' ? eventData : JSON.stringify(eventData || '');
          var win = window;
          if (win.TelegramWebviewProxy && win.TelegramWebviewProxy.postEvent) {
            win.TelegramWebviewProxy.postEvent(eventType, dataStr);
          } else if (win.webkit && win.webkit.messageHandlers && win.webkit.messageHandlers.webApp) {
            win.webkit.messageHandlers.webApp.postMessage(JSON.stringify({ eventType: eventType, eventData: dataStr }));
          } else if (win.parent && win.parent !== win) {
            win.parent.postMessage(JSON.stringify({ eventType: eventType, eventData: dataStr }), '*');
          }
        } catch (e) {}
      }

      // Signal Telegram client immediately so native loader dismisses without hanging
      postToTelegram('web_app_ready', '');
      postToTelegram('web_app_expand', '');
      postToTelegram('web_app_set_header_color', { color_key: 'bg_color', color: '#1e293b' });
      postToTelegram('web_app_set_background_color', { color: '#0f172a' });

      // Repeat signals on early ticks to handle delayed WebView bridge attachment
      setTimeout(function() { postToTelegram('web_app_ready', ''); postToTelegram('web_app_expand', ''); }, 150);
      setTimeout(function() { postToTelegram('web_app_ready', ''); postToTelegram('web_app_expand', ''); }, 600);

      // Parse initData from URL hash/query
      var parsedUser = null;
      try {
        var raw = (window.location.hash || '').slice(1) || (window.location.search || '').slice(1);
        var p = new URLSearchParams(raw);
        var tgData = p.get('tgWebAppData') || p.get('initData');
        if (tgData) {
          var dp = new URLSearchParams(tgData);
          var u = dp.get('user');
          if (u) {
            try { parsedUser = JSON.parse(decodeURIComponent(u)); } catch (e) {
              try { parsedUser = JSON.parse(u); } catch (e2) {}
            }
          }
        }
      } catch (e) {}

      // Fallback Telegram object if official script is unreachable or slow
      window.Telegram = window.Telegram || {};
      if (!window.Telegram.WebApp) {
        window.Telegram.WebApp = {
          ready: function() { postToTelegram('web_app_ready', ''); },
          expand: function() { postToTelegram('web_app_expand', ''); },
          close: function() { postToTelegram('web_app_close', ''); },
          enableClosingConfirmation: function() { postToTelegram('web_app_setup_closing_behavior', { need_confirmation: true }); },
          setHeaderColor: function(c) { postToTelegram('web_app_set_header_color', { color_key: 'bg_color', color: c }); },
          setBackgroundColor: function(c) { postToTelegram('web_app_set_background_color', { color: c }); },
          BackButton: {
            isVisible: false,
            show: function() { postToTelegram('web_app_setup_back_button', { is_visible: true }); },
            hide: function() { postToTelegram('web_app_setup_back_button', { is_visible: false }); },
            onClick: function(cb) { window.addEventListener('telegram_back', cb); },
            offClick: function(cb) { window.removeEventListener('telegram_back', cb); }
          },
          HapticFeedback: {
            impactOccurred: function(s) { postToTelegram('web_app_trigger_haptic_feedback', { type: 'impact', impact_style: s }); },
            notificationOccurred: function(t) { postToTelegram('web_app_trigger_haptic_feedback', { type: 'notification', notification_type: t }); },
            selectionChanged: function() { postToTelegram('web_app_trigger_haptic_feedback', { type: 'selection_change' }); }
          },
          initDataUnsafe: { user: parsedUser },
          colorScheme: 'dark',
          themeParams: { bg_color: '#0f172a', text_color: '#ffffff' }
        };
      }

      // Global error listener to display diagnosable feedback instead of infinite spin
      window.addEventListener('error', function(event) {
        console.error('[Global Error]', event.message, event.filename, event.lineno);
        var statusEl = document.getElementById('loader-status');
        var actionBox = document.getElementById('loader-action-box');
        var errDetail = document.getElementById('loader-error-detail');
        if (statusEl) statusEl.textContent = 'Ошибка загрузки страницы';
        if (actionBox) actionBox.style.display = 'block';
        if (errDetail && event.message) {
          errDetail.textContent = event.message;
          errDetail.style.display = 'block';
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        console.error('[Global Unhandled Rejection]', event.reason);
      });
    })();
  </script>

  <!-- Official Telegram WebApp SDK (async, non-blocking) -->
  <script async src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
  <div id="root">
    <!-- Immediate branded preloader while React bundle mounts -->
    <div id="preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; color: #f8fafc; text-align: center; font-family: system-ui, -apple-system, sans-serif; padding: 24px;">
      <div style="width: 64px; height: 64px; background: linear-gradient(135deg, #f59e0b, #fcd34d); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.3); animation: pulse 1.6s infinite ease-in-out;">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
        </svg>
      </div>
      <div style="font-size: 20px; font-weight: 800; letter-spacing: 0.5px; color: #ffffff;">ураа мемы</div>
      <div id="loader-status" style="font-size: 13px; color: #94a3b8; margin-top: 8px;">Загрузка мемов...</div>
      
      <!-- Subtle spinning indicator -->
      <div id="loader-spinner" style="margin-top: 18px; width: 22px; height: 22px; border: 2.5px solid rgba(245, 158, 11, 0.2); border-top-color: #f59e0b; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>

      <!-- Action buttons shown on delay or error so user is never trapped in infinite loading -->
      <div id="loader-action-box" style="display: none; margin-top: 20px;">
        <div id="loader-error-detail" style="font-size: 11px; color: #f87171; margin-bottom: 12px; max-width: 280px; word-break: break-all; display: none;"></div>
        <div style="display: flex; gap: 8px; justify-content: center;">
          <button onclick="window.location.reload(true)" style="background: #4f46e5; color: white; border: none; border-radius: 12px; padding: 10px 18px; font-size: 12px; font-weight: 700; cursor: pointer;">
            Обновить
          </button>
          <button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}window.location.reload(true)" style="background: #334155; color: #cbd5e1; border: 1px solid #475569; border-radius: 12px; padding: 10px 14px; font-size: 12px; font-weight: 600; cursor: pointer;">
            Очистить кэш
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // After 4 seconds, provide recovery buttons if bundle is still downloading
    setTimeout(function() {
      var p = document.getElementById('preloader');
      var actionBox = document.getElementById('loader-action-box');
      var statusEl = document.getElementById('loader-status');
      if (p && actionBox) {
        actionBox.style.display = 'block';
        if (statusEl) statusEl.textContent = 'Инициализация мемов...';
      }
    }, 4000);

    // GitHub Pages Static Fallback:
    // If running directly from GitHub repository root where /src/main.tsx cannot be parsed,
    // dynamically load pre-compiled production bundle!
    (function() {
      var isGitHubPages = window.location.hostname.indexOf('github.io') !== -1;
      if (isGitHubPages) {
        setTimeout(function() {
          if (!window.__APP_LOADED__ && document.getElementById('preloader')) {
            console.log('[GitHub Pages] Loading pre-compiled bundle from ./dist/assets/app.js');
            var s = document.createElement('script');
            s.type = 'module';
            s.crossOrigin = 'anonymous';
            s.src = './dist/assets/app.js';
            document.body.appendChild(s);

            var c = document.createElement('link');
            c.rel = 'stylesheet';
            c.crossOrigin = 'anonymous';
            c.href = './dist/assets/app.css';
            document.head.appendChild(c);
          }
        }, 500);
      }
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
